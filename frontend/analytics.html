<h1>Housing Analytics</h1>
<h2 style="text-align: center;">May take some time to load after running</h2>
<link rel="stylesheet" href="style.css">

<div class="controls-row">
    <h2>Price Trend</h2>
    <button class="page-btn" onclick="resetFilters()">Reset All</button>
    <button class="page-btn" onclick="location.href='index.html'">Back to Search</button>
</div>

<div class="search-box">
    <label>Location</label>
    <input id="trend_location" placeholder="Location">

    <label>Property Type</label>
    <select id="trend_type">
        <option value="">All</option>
        <option value="D">Detached</option>
        <option value="S">Semi</option>
        <option value="T">Terraced</option>
        <option value="F">Flat</option>
        <option value="residential">Residential</option>
    </select>

    <button onclick="searchPriceTrend()">Add</button>
</div>

<!-- active datasets -->
<div id="active_datasets"></div>

<canvas id="price_chart"></canvas>

<h2>Most Expensive Streets</h2>

<div class="search-box">
    <label>Location</label>
    <input id="streets_location" placeholder="Location">

    <label>Property Type</label>
    <select id="streets_type">
        <option value="">All</option>
        <option value="D">Detached</option>
        <option value="S">Semi</option>
        <option value="T">Terraced</option>
        <option value="F">Flat</option>
        <option value="O">Other</option>
        <option value="residential">Residential</option>
    </select>

    <label>Minimum Sales</label>
    <input id="streets_min_sales" type="number" value="5">

    <label>Limit</label>
    <input id="streets_limit" type="number" value="5">

    <button onclick="searchExpensiveStreets()">Run</button>
</div>
<table id="expensive_table">
    <thead>
        <tr>
            <th>Street</th>
            <th>Town</th>
            <th>Sales</th>
            <th>Average Price</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>



<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="analytics.js"></script>
