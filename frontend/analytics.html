<h1>Housing Analytics</h1>
<h2 style="text-align: center;">May take some time to load after running</h2>
<link rel="stylesheet" href="style.css">

<h2>Price Trend</h2>

<label>Location</label>
<input id="trend_location">

<label>Property Type</label>
<select id="trend_type">
    <option value="">All</option>
    <option value="D">Detached</option>
    <option value="S">Semi</option>
    <option value="T">Terraced</option>
    <option value="F">Flat</option>
</select>

<button onclick="searchPriceTrend()">Run</button>

<canvas id="price_chart"></canvas>
<hr>

<h2>Most Expensive Streets</h2>

<label>Location</label>
<input id="streets_location">

<label>Property Type</label>
<select id="streets_type">
    <option value="">All</option>
    <option value="D">Detached</option>
    <option value="S">Semi</option>
    <option value="T">Terraced</option>
    <option value="F">Flat</option>
</select>

<label>Minimum Sales</label>
<input id="streets_min_sales" type="number" value="5">

<label>Limit</label>
<input id="streets_limit" type="number" value="10">

<button onclick="searchExpensiveStreets()">Run</button>

<table id="expensive_table">
    <thead>
        <tr>
            <th>Street</th>
            <th>Town</th>
            <th>Sales</th>
            <th>Average Price</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<hr>

<a href="index.html">
    <button>Back to Search</button>
</a>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="analytics.js"></script>
