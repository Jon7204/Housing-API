<!DOCTYPE html>
<html>
<head>
    <title>UK Housing API</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>UK Housing Market API</h1>

<div class="search-box">

    <input id="location" placeholder="Location">
    <input id="min_price" placeholder="Min Price">
    <input id="max_price" placeholder="Max Price">
    <input id="start_date" type="date">
    <input id="end_date" type="date">

    <button onclick="search()">Search</button>
    <button onclick="resetFilters()">Reset</button>

</div>
<label for="sort">Sort By:</label>
<select id="sort">
    <option value="">None</option>
    <option value="price">Price (Low → High)</option>
    <option value="-price">Price (High → Low)</option>
    <option value="date">Date (Old → New)</option>
    <option value="-date">Date (New → Old)</option>
</select>


<input id="limit" placeholder="Limit (default 50)">
<input id="offset" placeholder="Offset">

<h2 id="avg_price">Average Price: (If Location)</h2>

<table id="results">
    <thead>
        <tr>
            <th>ID</th>
            <th>Price</th>
            <th>Date</th>
            <th>Postcode</th>
            <th>PAON</th>
            <th>Street</th>
            <th>Town / City</th>
            <th>Property Type</th>
            <th>Tenure</th>
        </tr>
    </thead>
    <tbody>
    </tbody>
</table>



<script src="script.js"></script>

</body>
</html>
