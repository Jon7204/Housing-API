<!DOCTYPE html>
<html>
<head>
    <title>UK Housing API</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>UK Housing Market API</h1>

<div class="search-box">

    <input id="location" placeholder="Town / City">
    <input id="min_price" placeholder="Min Price">
    <input id="max_price" placeholder="Max Price">

    <button onclick="search()">Search</button>

</div>

<table id="results">
    <thead>
        <tr>
            <th>ID</th>
            <th>Town</th>
            <th>Postcode</th>
            <th>Price</th>
            <th>Date</th>
            <th>Type</th>
        </tr>
    </thead>
    <tbody>
    </tbody>
</table>


<script src="script.js"></script>

</body>
</html>
