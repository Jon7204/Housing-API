<!DOCTYPE html>
<html>
<head>
    <title>UK Housing API</title>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background: #f5f5f5;
        }

        h1 {
            margin-bottom: 20px;
        }

        .search-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        input {
            padding: 8px;
            margin-right: 10px;
        }

        button {
            padding: 8px 14px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f0f0f0;
        }
    </style>
</head>

<body>

<h1>UK Housing Market API</h1>

<div class="search-box">

    <input id="location" placeholder="Town / City">
    <input id="min_price" placeholder="Min Price">
    <input id="max_price" placeholder="Max Price">

    <button onclick="search()">Search</button>

</div>

<table id="results">
    <thead>
        <tr>
            <th>ID</th>
            <th>Town</th>
            <th>Postcode</th>
            <th>Price</th>
            <th>Date</th>
            <th>Type</th>
        </tr>
    </thead>
    <tbody>
    </tbody>
</table>


<script src="script.js"></script>

</body>
</html>
